[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electoral-roll-ocr"
version = "0.1.0"
description = "Production-grade Electoral Roll OCR system scaffold."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "PyMuPDF==1.26.4",
  "groq>=0.31.0",
  "openai>=1.99.5",
  "opencv-python==4.12.0.88",
  "paddleocr==2.10.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pandas==2.3.1",
  "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.12.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
